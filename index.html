<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Will it be rendered poorly?</title>
        <style>
            :root {
                --bg-color: #f4f4f9;
                --text-color: #333;
                --panel-bg: #fff;
                --border-color: #ddd;
                --primary-color: #0066ff;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* Fullscreen App Layout */
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    Helvetica, Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                margin: 0;
                height: 100vh; /* Fill the entire viewport height */
                overflow: hidden; /* Prevent the whole page from scrolling */
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            h1 {
                text-align: center;
                font-size: 1.5rem;
                padding: 15px 0;
				margin: 0;
                width: 100%;
                flex-shrink: 0;
				border-bottom: 1px solid var(--border-color);
				background-color: var(--panel-bg);
            }

            /* Main Layout Shell */
            .app-layout {
                display: flex;
                width: 100%;
                flex: 1; /* Take up all remaining height below the h1 */
                overflow: hidden; /* Contain the scrollable children */
            }

            /* Sidebar Controls Section */
            .sidebar {
                background: var(--panel-bg);
                padding: 20px;
                border-right: 1px solid var(--border-color);
                display: flex;
                flex-direction: column;
                gap: 20px;
                width: 300px;
                flex-shrink: 0;
                height: 100%;
                overflow-y: auto; /* Independent scrolling for the sidebar */
            }

            .control-group {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            label {
                font-size: 0.9rem;
                font-weight: bold;
            }

            input[type="file"],
            input[type="text"] {
                font-size: 0.9rem;
            }

            select,
            input[type="text"] {
                padding: 8px;
                border: 1px solid var(--border-color);
                border-radius: 4px;
                font-size: 1rem;
                width: 100%;
            }

            /* Hidden by default, toggled via JS */
            #custom-controls {
                display: none; 
                flex-direction: column;
                gap: 15px;
                padding-top: 15px;
                border-top: 1px solid var(--border-color);
            }

            /* Main Content Area */
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                height: 100%;
                overflow-y: auto; /* Independent scrolling for the previews */
                padding: 20px;
            }

            /* Tabs Section */
            .tabs {
                display: flex;
                justify-content: center;
                gap: 10px;
                margin-bottom: 30px;
                flex-shrink: 0;
            }

            .tab-btn {
                padding: 10px 20px;
                border: none;
                background-color: #e0e0e0;
                cursor: pointer;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: bold;
                transition:
                    background-color 0.2s,
                    color 0.2s;
            }

            .tab-btn.active {
                background-color: var(--primary-color);
                color: white;
            }

            .tab-content {
                display: none; /* Hidden by default */
            }

            .tab-content.active {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 30px;
            }

            /* Previews Section (Presets) */
            .previews-container {
                display: flex;
                flex-wrap: wrap;
                gap: 30px;
                justify-content: center;
                align-items: flex-end;
                width: 100%;
            }

            .device-wrapper {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .device-label {
                font-weight: bold;
                color: #555;
            }

            /* Screens Base Styles */
            .screen {
                background-color: #e0e0e0;
                border: 8px solid #333;
                border-radius: 12px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
                background-image: none;
                transition: background 0.3s ease; /* Only transition background, not dimensions */
            }

            .desktop,
            .tablet,
            .phone {
                border-width: 12px;
                border-radius: 16px;
            }

            .desktop {
                width: 800px;
                height: 450px;
            }
            .tablet {
                width: 384px;
                height: 512px;
            }
            .phone {
                width: 250px;
                height: 500px;
            }

            /* Custom Screen Styles */
            .custom-screen {
                width: 600px;
                height: 400px;
                max-width: 100%; 
                resize: both; 
                overflow: hidden; 
                border-radius: 8px;
            }

            /* Helper text for empty state */
            .empty-text {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100%;
                color: #888;
                font-size: 1.2rem;
            }
            .has-image .empty-text {
                display: none;
            }

            /* Responsive tweaks for smaller screens */
            @media (max-width: 900px) {
                body {
                    height: auto; /* Let it flow naturally on mobile */
                    overflow: auto;
                }
                .app-layout {
                    flex-direction: column;
                    overflow: visible;
                }
                .sidebar {
                    width: 100%;
                    height: auto;
                    border-right: none;
                    border-bottom: 1px solid var(--border-color);
                    overflow-y: visible;
                }
                .main-content {
                    overflow-y: visible;
                }
                .desktop {
                    width: 100%;
                    height: 56.25vw; /* maintain roughly 16:9 */
                }
            }
        </style>
    </head>
    <body>
        <h1>Si vedrà uno schifo?</h1>

        <div class="app-layout">
            <!-- Sidebar: Global Controls -->
            <aside class="sidebar">
                <div class="control-group">
                    <label for="image-upload">Upload Image:</label>
                    <input type="file" id="image-upload" accept="image/*" />
                </div>

                <div class="control-group">
                    <label for="bg-size">Background Size:</label>
                    <select id="bg-size">
                        <option value="cover" selected>
                            Cover (Fills area, crops)
                        </option>
                        <option value="contain">
                            Contain (No crop, leaves space)
                        </option>
                        <option value="100% 100%">100% 100% (Stretches)</option>
                        <option value="auto">Auto (Original size)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="bg-position">Background Position:</label>
                    <select id="bg-position">
                        <option value="top left" selected>Top Left</option>
                        <option value="top center">Top Center</option>
                        <option value="top right">Top Right</option>
                        <option value="center left">Center Left</option>
                        <option value="center center">Center Center</option>
                        <option value="center right">Center Right</option>
                        <option value="bottom left">Bottom Left</option>
                        <option value="bottom center">Bottom Center</option>
                        <option value="bottom right">Bottom Right</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="bg-repeat">Background Repeat:</label>
                    <select id="bg-repeat">
                        <option value="no-repeat" selected>No Repeat</option>
                        <option value="repeat">Repeat</option>
                        <option value="repeat-x">Repeat X</option>
                        <option value="repeat-y">Repeat Y</option>
                    </select>
                </div>

                <!-- Custom Canvas Controls (Hidden by default) -->
                <div id="custom-controls">
                    <div class="control-group">
                        <label for="custom-w">Width (px, vw, %):</label>
                        <input type="text" id="custom-w" value="600px" />
                    </div>
                    <div class="control-group">
                        <label for="custom-h">Height (px, vh, %):</label>
                        <input type="text" id="custom-h" value="400px" />
                    </div>
                </div>
            </aside>

            <!-- Main Content Area: Tabs & Previews -->
            <main class="main-content">
                <!-- Tab Navigation -->
                <div class="tabs">
                    <button class="tab-btn active" data-tab="presets">
                        Standard Presets
                    </button>
                    <button class="tab-btn" data-tab="custom">
                        Custom Canvas
                    </button>
                </div>

                <!-- TAB 1: Standard Presets -->
                <div id="tab-presets" class="tab-content active">
                    <div class="previews-container">
                        <div class="device-wrapper">
                            <div class="device-label">Desktop (16:9)</div>
                            <div class="screen desktop" id="screen-desktop">
                                <div class="empty-text">No Image</div>
                            </div>
                        </div>
                        <div class="device-wrapper">
                            <div class="device-label">Tablet Portrait</div>
                            <div class="screen tablet" id="screen-tablet">
                                <div class="empty-text">No Image</div>
                            </div>
                        </div>
                        <div class="device-wrapper">
                            <div class="device-label">Phone</div>
                            <div class="screen phone" id="screen-phone">
                                <div class="empty-text">No Image</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TAB 2: Custom Canvas -->
                <div id="tab-custom" class="tab-content">
                    <div class="device-wrapper">
                        <div class="device-label">
                            Drag the bottom right corner to resize!
                        </div>
                        <div class="screen custom-screen" id="screen-custom">
                            <div class="empty-text">No Image</div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script>
            // --- 1. Global Background Settings ---
            const fileInput = document.getElementById("image-upload");
            const sizeSelect = document.getElementById("bg-size");
            const posSelect = document.getElementById("bg-position");
            const repeatSelect = document.getElementById("bg-repeat");
            const screens = document.querySelectorAll(".screen"); // Captures presets AND custom screen

            let currentImageUrl = "";

            fileInput.addEventListener("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        currentImageUrl = `url(${e.target.result})`;
                        screens.forEach((screen) =>
                            screen.classList.add("has-image"),
                        );
                        applyStyles();
                    };
                    reader.readAsDataURL(file);
                }
            });

            function applyStyles() {
                if (!currentImageUrl) return;
                const size = sizeSelect.value;
                const position = posSelect.value;
                const repeat = repeatSelect.value;

                screens.forEach((screen) => {
                    screen.style.backgroundImage = currentImageUrl;
                    screen.style.backgroundSize = size;
                    screen.style.backgroundPosition = position;
                    screen.style.backgroundRepeat = repeat;
                });
            }

            sizeSelect.addEventListener("change", applyStyles);
            posSelect.addEventListener("change", applyStyles);
            repeatSelect.addEventListener("change", applyStyles);

            // --- 2. Tab Switching & Sidebar Logic ---
            const tabBtns = document.querySelectorAll(".tab-btn");
            const tabContents = document.querySelectorAll(".tab-content");
            const customControls = document.getElementById("custom-controls");

            tabBtns.forEach((btn) => {
                btn.addEventListener("click", () => {
                    // Remove active class from all buttons and contents
                    tabBtns.forEach((b) => b.classList.remove("active"));
                    tabContents.forEach((c) => c.classList.remove("active"));

                    // Add active class to clicked button and target content
                    btn.classList.add("active");
                    const targetId = `tab-${btn.dataset.tab}`;
                    document.getElementById(targetId).classList.add("active");

                    // Toggle Custom Width/Height inputs in the sidebar
                    if (btn.dataset.tab === "custom") {
                        customControls.style.display = "flex";
                    } else {
                        customControls.style.display = "none";
                    }
                });
            });

            // --- 3. Custom Canvas Sizing Logic ---
            const customWInput = document.getElementById("custom-w");
            const customHInput = document.getElementById("custom-h");
            const customScreen = document.getElementById("screen-custom");

            // Apply typing changes to the div
            function updateCustomDivSize() {
                customScreen.style.width = customWInput.value;
                customScreen.style.height = customHInput.value;
            }

            customWInput.addEventListener("input", updateCustomDivSize);
            customHInput.addEventListener("input", updateCustomDivSize);

            // Apply drag-resize changes back to the text inputs using ResizeObserver
            const resizeObserver = new ResizeObserver((entries) => {
                for (let entry of entries) {
                    // Prevent a loop where typing triggers this observer and overwrites what the user is typing
                    if (
                        document.activeElement === customWInput ||
                        document.activeElement === customHInput
                    ) {
                        return;
                    }

                    // If the user drags the corner, update the inputs with the exact pixel values
                    const newWidth = entry.target.offsetWidth + "px";
                    const newHeight = entry.target.offsetHeight + "px";

                    if (customWInput.value !== newWidth)
                        customWInput.value = newWidth;
                    if (customHInput.value !== newHeight)
                        customHInput.value = newHeight;
                }
            });

            // Start watching the custom screen for resize events
            resizeObserver.observe(customScreen);
        </script>
    </body>
</html>
